services:
  sport-dashboard:
    build: .
    container_name: sport-dashboard
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_NAME: postgres_db
      DB_USER: postgres_user
      DB_PASSWORD: ${DB_PASSWORD}
      NEXT_PUBLIC_SITE_URL: https://84.54.57.64:787
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sport-db
      - sport-web

  sport-nginx:
    image: nginx:1.29-alpine
    container_name: sport-nginx
    depends_on:
      sport-dashboard:
        condition: service_healthy
    ports:
      - "787:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/dcomp/sast/certbot/conf:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        (while :; do sleep 6h; nginx -s reload; done) &
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - sport-web

networks:
  sport-db:
    external: true
    name: postgres_default
  sport-web:
    driver: bridge
